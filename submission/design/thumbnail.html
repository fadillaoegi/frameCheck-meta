<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FrameCheck YouTube thumbnail</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 1280px; height: 720px; overflow: hidden; position: relative; }
  .logo { position: absolute; left: 56px; top: 44px; display: flex; align-items: center; gap: 14px; font-size: 34px; }
  .logo img { width: 54px; }
  h1 { position: absolute; z-index: 2; left: 56px; top: 140px; width: 600px; font-size: 84px; line-height: 0.98; text-transform: uppercase; }
  h1 .pink { font-style: italic; }
  .sub { position: absolute; z-index: 2; left: 60px; top: 478px; width: 560px; font-size: 26px; line-height: 1.35; color: var(--ink-2); }
  .sub b { color: var(--ink); }
  .badge { position: absolute; left: 56px; bottom: 50px; display: flex; gap: 12px; }
  .badge .chip { font-size: 17px; padding: 9px 16px; }

  .stage { position: absolute; left: 650px; top: 120px; width: 620px; height: 560px; perspective: 1500px; }
  .layer { position: absolute; left: 40px; width: 540px; transform-origin: 50% 50%; transform-style: preserve-3d; }
  .layer img { width: 100%; display: block; border-radius: 8px; }
  .l1 { top: 250px; transform: rotateX(52deg) rotateZ(-28deg); filter: brightness(0.82); }
  .l2 { top: 90px; transform: rotateX(52deg) rotateZ(-28deg) translateZ(40px); }
  .l1 img { box-shadow: 0 0 0 3px var(--neon), 0 0 50px -6px var(--neon); }
  .l2 img { box-shadow: 0 0 0 3px var(--build), 0 0 50px -6px var(--build); }
  .tag { position: absolute; left: 0; top: -34px; padding: 5px 12px; border-radius: 8px 8px 0 0; font: 700 16px "IBM Plex Mono", monospace; letter-spacing: 3px; color: #07070e; }
  .mark { position: absolute; left: 67.1%; top: 42.6%; width: 26.4%; height: 5.6%; border-radius: 3px; border: 3px solid var(--missing); box-shadow: 0 0 18px var(--missing); }
  .mark.ghost { border-style: dashed; background: rgb(255 46 99 / 0.12); }
  .found { position: absolute; right: 50px; top: 46px; padding: 14px 20px; border-radius: 16px; text-align: right; }
  .found .big { font-size: 54px; line-height: 1; }
</style>
</head>
<body class="grid-bg">
  <div class="logo display"><img src="assets/framecheck-mark-neon.svg" alt=""><span>Frame<span class="neon">Check</span></span></div>
  <h1 class="display">Does the build <span class="pink">match</span> the design?</h1>
  <p class="sub">AI visual QA with evidence, powered by <b>Meta Muse Spark</b></p>
  <div class="badge">
    <span class="chip" style="color: var(--missing)"><i></i>Missing</span>
    <span class="chip" style="color: var(--clipped)"><i></i>Clipped</span>
    <span class="chip" style="color: var(--layout)"><i></i>Misplaced</span>
  </div>

  <div class="stage">
    <div class="layer l1"><span class="tag" style="background: var(--neon)">DESIGN</span><img src="assets/kopiku-design.png" alt=""><span class="mark"></span></div>
    <div class="layer l2"><span class="tag" style="background: var(--build)">BUILD</span><img src="assets/kopiku-build.png" alt=""><span class="mark ghost"></span></div>
  </div>
  <div class="found panel glow"><div class="kicker">Live run</div><div class="big display neon">3 / 3</div><div class="mono" style="font-size:15px;color:var(--ink-2)">defects found</div></div>
</body>
</html>
